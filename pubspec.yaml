name: xue_hua_navite_clipboard
description: "Cross-platform full-featured native clipboard plugin for Flutter (Android, iOS, macOS, Windows, Linux, Web)."
version: 0.0.1
homepage: https://github.com/kurban/xue_hua_navite_clipboard

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_navite_clipboard
        pluginClass: XueHuaNaviteClipboardPlugin
      ios:
        pluginClass: XueHuaNaviteClipboardPlugin
      linux:
        pluginClass: XueHuaNaviteClipboardPlugin
      macos:
        pluginClass: XueHuaNaviteClipboardPlugin
      windows:
        pluginClass: XueHuaNaviteClipboardPluginCApi
      web:
        pluginClass: XueHuaNaviteClipboardWeb
        fileName: xue_hua_navite_clipboard_web.dart
