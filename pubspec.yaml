name: xue_hua_navite_clipboard
description: "Cross-platform full-featured native clipboard plugin for Flutter (Android, iOS, macOS, Windows, Linux, Web)."
version: 1.1.0
homepage: https://github.com/Matkurban
repository: https://github.com/Matkurban/xue_hua_navite_clipboard
topics:
  - clipboard
  - paste
  - pasteboard

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  jni: ^1.2.1
  meta: ^1.19.0
  objective_c: ^9.6.4
  web: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^30.0.4
  ffigen: ^22.0.0
  swift2objc: ^0.3.1
  swiftgen: ^0.2.0
  path: ^1.9.1
  pub_semver: ^2.2.1
  jnigen: ^1.1.0
  logging: ^1.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_navite_clipboard
        pluginClass: XueHuaNaviteClipboardPlugin
      ios:
        pluginClass: XueHuaNaviteClipboardPlugin
      linux:
        pluginClass: XueHuaNaviteClipboardPlugin
      macos:
        pluginClass: XueHuaNaviteClipboardPlugin
      windows:
        pluginClass: XueHuaNaviteClipboardPluginCApi
      web:
        pluginClass: XueHuaNaviteClipboardWeb
        fileName: xue_hua_navite_clipboard_web.dart
